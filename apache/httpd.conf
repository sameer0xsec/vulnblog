# VULN-laden Apache config for VulnBlog — intentionally insecure, annotated inline.
ServerRoot "/usr/local/apache2"
Listen 80
LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule authn_file_module modules/mod_authn_file.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule dir_module modules/mod_dir.so
LoadModule mime_module modules/mod_mime.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule status_module modules/mod_status.so
LoadModule autoindex_module modules/mod_autoindex.so
LoadModule alias_module modules/mod_alias.so

# VULN: ServerSignature/ServerTokens left at defaults -> Apache version +
# OS disclosed in error pages and the Server response header.
ServerTokens Full
ServerSignature On

<Directory />
    AllowOverride none
    Require all denied
</Directory>

DocumentRoot "/usr/local/apache2/htdocs"

# VULN: TRACE method not disabled -> classic Cross-Site Tracing (XST) vector.
TraceEnable On

# VULN: mod_status exposed with no access restriction — leaks internal
# server state (active requests, client IPs, requested URLs) to anyone.
<Location "/server-status">
    SetHandler server-status
    Require all granted
</Location>

# VULN: directory listing enabled on the uploads share, so every uploaded
# file (avatars, anything else dropped there) is browsable.
<Directory "/var/www/uploads">
    Options +Indexes
    Require all granted
</Directory>
Alias /uploads /var/www/uploads

# VULN: no security headers configured at all anywhere in this file — no
# CSP, X-Frame-Options, X-Content-Type-Options, HSTS, Referrer-Policy.

ProxyPreserveHost On

# VULN: internal admin API proxied with no auth enforced at this layer,
# relying entirely on the Flask backend remembering to check (it doesn't
# always — see /api/admin/users/:id PATCH).
ProxyPass "/internal/" "http://backend:5000/api/admin/"
ProxyPassReverse "/internal/" "http://backend:5000/api/admin/"

ProxyPass "/api/" "http://backend:5000/api/"
ProxyPassReverse "/api/" "http://backend:5000/api/"

ProxyPass "/" "http://frontend:5173/"
ProxyPassReverse "/" "http://frontend:5173/"

TypesConfig conf/mime.types
